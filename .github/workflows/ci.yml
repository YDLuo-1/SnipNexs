name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows-build-test:
    # windows-2022 keeps VS 17.x: CMake 3.31's InstallRequiredSystemLibraries
    # cannot locate the VS 18 redist layout used by windows-latest.
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Restore Qt 6.11.2 kit
        # The online Qt repository has no desktop repository metadata for
        # 6.11.2 yet (empty placeholder dirs), so CI restores our pinned kit
        # from a release asset instead of aqtinstall.
        run: |
          curl -sL --retry 3 -o D:/qt-kit.zip https://github.com/YDLuo-1/SnipNexs/releases/download/ci-deps-qt-6.11.2/Qt-6.11.2-msvc2022_64.zip
          Expand-Archive -Path D:/qt-kit.zip -DestinationPath D:/Qt/6.11.2
          Add-Content $env:GITHUB_ENV "SNIPNEXS_QT_DIR=D:/Qt/6.11.2/msvc2022_64"

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Pin CMake 3.31
        # CMake 4 rejects third_party cmake_minimum_required(VERSION <3.5)
        # that CTranslate2 vendored dependencies still carry.
        run: python -m pip install "cmake==3.31.*" && cmake --version

      - name: Configure
        run: cmake --preset windows-release

      - name: Build
        run: cmake --build --preset windows-release --parallel

      - name: Test
        # NativeScreenRecorderTests samples WGC timing and is sensitive to
        # VM scheduling; allow up to three attempts for that test only.
        run: ctest --preset windows-release --output-on-failure --repeat until-pass,3
